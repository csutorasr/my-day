<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-day</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3de;
    --accent: #2f5bd3; --warn: #b4540a; --bad: #b3261e; --ok: #1f7a4d; --chip: #efeee9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9b9a93; --line: #33322f;
      --accent: #7f9ef0; --warn: #e39b58; --bad: #f08a80; --ok: #6cc59a; --chip: #2a2a27;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .badge.warn { color: var(--warn); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  .count { color: var(--ink); }
  .grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows li { padding: 8px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: baseline; }
  ul.rows li:first-child { border-top: 0; }
  .id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .title { overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .reason { color: var(--bad); font-size: 13px; margin-top: 2px; }
  .hint { color: var(--muted); font-size: 12px; font-style: italic; }
  .status { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links a { margin-right: 8px; font-size: 12px; }
  .empty { color: var(--muted); padding: 6px 0; }
  ul.rows li.empty { display: block; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .filters input { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .ev { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 110px 140px 1fr; gap: 8px; }
  .ev:first-child { border-top: 0; }
  .ev .k { color: var(--muted); font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 560px) {
    ul.rows li { grid-template-columns: 1fr auto; }
    ul.rows li .id { grid-column: 1 / -1; }
    .ev { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="live" title="live connection"></span>
  <h1>my-day</h1>
  <span class="badge warn" id="dry" hidden>dry run</span>
  <span class="badge" id="dir"></span>
  <span class="spacer"></span>
  <button id="notify">Enable notifications</button>
</header>
<main>
  <div class="grid2">
    <section><h2>Reviews for you <span class="count" id="c-reviews"></span></h2><ul class="rows" id="reviews"></ul></section>
    <section><h2>Questions <span class="count" id="c-questions"></span></h2><ul class="rows" id="questions"></ul></section>
  </div>
  <section><h2>Failures <span class="count" id="c-failed"></span></h2><ul class="rows" id="failed"></ul></section>
  <section><h2>Tasks <span class="count" id="c-tasks"></span></h2><div id="board"></div></section>
  <section>
    <h2>Activity</h2>
    <div class="filters">
      <button data-range="today">Today</button>
      <button data-range="yesterday">Yesterday</button>
      <label>from <input type="date" id="from"></label>
      <label>to <input type="date" id="to"></label>
      <button id="apply">Apply</button>
    </div>
    <div id="events"></div>
  </section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
